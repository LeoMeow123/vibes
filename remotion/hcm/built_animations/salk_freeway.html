<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salk Data Freeway</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#05080f;overflow:hidden;font-family:'Space Grotesk',sans-serif;}
  .wrap{position:relative;width:836px;height:1266px;margin:0 auto;
        transform:scale(.55);transform-origin:top center;}
  .map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
       filter:brightness(.5) saturate(.7) contrast(1.05);}
  /* night vignette */
  .wrap::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 40%, transparent 40%, rgba(2,5,12,.85) 100%);}
  svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;}
  .node{position:absolute;z-index:4;transform:translate(-50%,-50%);text-align:center;opacity:0;
        transition:opacity .5s;}
  .node.show{opacity:1;}
  .dot{width:26px;height:26px;border-radius:50%;margin:0 auto;
       background:radial-gradient(circle,#cfe9ff,#4aa3ff);
       box-shadow:0 0 18px #4aa3ff,0 0 40px rgba(74,163,255,.6);}
  .node.src .dot{background:radial-gradient(circle,#fff,#ff8a3c);box-shadow:0 0 18px #ff8a3c,0 0 44px rgba(255,138,60,.7);}
  .node.infer .dot{background:radial-gradient(circle,#e9ffe9,#48e07a);box-shadow:0 0 18px #48e07a,0 0 44px rgba(72,224,122,.7);}
  .node .tag{font-family:'JetBrains Mono',monospace;font-size:15px;color:#eaf2ff;
       margin-top:8px;background:rgba(5,10,20,.82);border:1px solid rgba(120,160,220,.4);
       padding:5px 10px;border-radius:8px;white-space:nowrap;font-weight:700;letter-spacing:.5px;}
  .node .tag small{display:block;font-weight:400;color:#8fa6cc;font-size:11px;letter-spacing:1px;}
  .pulse{animation:pp 1.4s ease-in-out infinite;}
  @keyframes pp{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  .flow{fill:none;stroke-width:3.5;stroke-linecap:round;
        stroke-dasharray:14 220;filter:drop-shadow(0 0 5px currentColor);}
  .caption{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;
    font-family:'JetBrains Mono',monospace;font-size:18px;color:#dce8ff;
    background:rgba(5,10,20,.85);border:1px solid rgba(120,160,220,.45);
    padding:10px 22px;border-radius:30px;letter-spacing:1px;opacity:0;transition:opacity .4s;}
  .caption.show{opacity:1;}
  .legend{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;}
  .legend h2{color:#eaf2ff;font-size:22px;font-weight:700;letter-spacing:1px;}
  .legend p{color:#8fa6cc;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;margin-top:3px;}
</style>
</head>

<script>
const cap=document.getElementById('cap');
function setDash(id, on){
  const p=document.getElementById(id);
  const len=p.getTotalLength();
  if(on){
    p.style.transition='none';
    p.style.strokeDasharray=len;
    p.style.strokeDashoffset=len;
    p.getBoundingClientRect();
    p.style.transition='stroke-dashoffset 1.3s ease';
    p.style.strokeDashoffset='0';
  } else {
    p.style.transition='none';
    p.style.strokeDasharray=len;
    p.style.strokeDashoffset=len;
  }
}
function show(id){document.getElementById(id).classList.add('show');}
function hideAll(){
  ['b1','b2','b3','b4'].forEach(i=>document.getElementById(i).classList.remove('show'));
  ['p1','p2','p3'].forEach(i=>setDash(i,false));
  cap.classList.remove('show');
}
function cset(t){cap.textContent=t;cap.classList.add('show');}

function run(){
  hideAll();
  setTimeout(()=>{show('b1');cset('Data lights up in Building 1 (EBS)');},500);
  setTimeout(()=>{setDash('p1',true);cset('Races to the 3rd-floor machines');},1800);
  setTimeout(()=>{show('b2');},2900);
  setTimeout(()=>{setDash('p2',true);cset('Climbs to the 5th floor for inference on Triton');},3600);
  setTimeout(()=>{show('b3');},4700);
  setTimeout(()=>{setDash('p3',true);cset('Flows back down to VAST storage');},5400);
  setTimeout(()=>{show('b4');},6500);
  setTimeout(()=>{cset('Record 50 → Infer 120 → Store');},7400);
  setTimeout(run, 10500);
}
run();
</script>
